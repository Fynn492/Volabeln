<style>
/* Layout: one column like a school notebook page. Cards are Seyès-ruled sheets with a red margin line; everything else sits quietly on a cool grey desk. */
:root {
  --bg: #edf0f7;
  --card: #fbfcff;
  --ink: #161d3a;
  --muted: #566082;
  --accent: #2338c9;
  --accent-ink: #ffffff;
  --rule: #e1e6f5;
  --rule-strong: #c5cdee;
  --margin: #d4456b;
  --ok: #1b7650;
  --bad: #b3263e;
  --soft: #e2e7f6;
  --f-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --card: #171b2e; --ink: #e8ebfa; --muted: #9aa2c6; --accent: #8d9cff; --accent-ink: #0f1220;
    --rule: #1f2543; --rule-strong: #2c3459; --margin: #e3688a; --ok: #58c995; --bad: #ff7d92; --soft: #1e2340;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --card: #171b2e; --ink: #e8ebfa; --muted: #9aa2c6; --accent: #8d9cff; --accent-ink: #0f1220;
  --rule: #1f2543; --rule-strong: #2c3459; --margin: #e3688a; --ok: #58c995; --bad: #ff7d92; --soft: #1e2340;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--f-display);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 500; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
.mono { font-family: var(--f-mono); }

/* ruled sheet */
.sheet {
  position: relative;
  background-color: var(--card);
  background-image:
    linear-gradient(var(--rule-strong) 1px, transparent 1px),
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 100% 32px, 100% 8px, 64px 100%;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
}
.sheet::before {
  content: ""; position: absolute; inset-block: 0; inset-inline-start: 34px; width: 2px;
  background: var(--margin); opacity: 0.75;
}
.sheet > * { position: relative; }
.pad { padding: 20px 20px 20px 54px; }

/* today */
.today { display: flex; flex-direction: column; gap: 16px; }
.counts { display: flex; gap: 28px; flex-wrap: wrap; }
.count { display: flex; flex-direction: column; }
.count b { font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.count span { font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 6px; }
.btn-main {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px;
  padding: 14px 18px; font-weight: 600; font-size: 17px; width: 100%;
}
.btn-main:hover { filter: brightness(1.08); }
.btn-main[disabled] { background: var(--soft); color: var(--muted); cursor: default; filter: none; }
.note { color: var(--muted); font-size: 14px; }

/* panels on the desk */
.panel { display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: end; }
.box { display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: center; }
.box .n { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.box .bar { height: 84px; display: flex; align-items: flex-end; background: var(--soft); border-radius: 3px; overflow: hidden; }
.box .bar i { display: block; width: 100%; background: var(--accent); min-height: 0; transition: height .3s; }
.box:last-child .bar i { background: var(--ok); }
.box .l { font-size: 12px; color: var(--muted); line-height: 1.25; }
.box .l b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 10px 6px; font-size: 14px; border-inline-end: 1px solid var(--rule-strong); }
.seg button:last-child { border-inline-end: 0; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 8px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--card); }
.stepper button { border: 0; background: transparent; width: 42px; height: 40px; font-size: 20px; line-height: 1; }
.stepper output { min-width: 40px; text-align: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule-strong); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.danger { color: var(--bad); }
.sync { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* session */
.sessionbar { display: flex; align-items: center; gap: 14px; }
.prog { flex: 1; height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.sessionbar .count-s { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card {
  display: block; width: 100%; text-align: left; color: var(--ink);
  min-height: 320px; padding: 22px 20px 22px 54px; cursor: pointer;
}
.card.done { cursor: default; }
.card-in { display: flex; flex-direction: column; gap: 14px; min-height: 274px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tag { border: 1px solid var(--rule-strong); border-radius: 3px; padding: 1px 6px; background: var(--card); }
.word { font-size: clamp(30px, 8vw, 42px); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
.answer { font-size: clamp(24px, 6.4vw, 32px); line-height: 1.2; font-weight: 600; color: var(--accent); text-wrap: balance; overflow-wrap: anywhere; border-top: 2px solid var(--margin); padding-top: 14px; margin-top: auto; }
.hint { margin-top: auto; font-size: 14px; color: var(--muted); }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grade { border-radius: 4px; padding: 12px 6px; font-weight: 600; background: var(--card); border: 2px solid var(--rule-strong); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.grade small { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--muted); }
.grade.again { border-color: var(--bad); color: var(--bad); }
.grade.good { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.grade.good small { color: var(--accent-ink); opacity: .8; }
.grade.easy { border-color: var(--ok); color: var(--ok); }
.grade:hover { filter: brightness(1.06); }
.summary-nums { display: flex; gap: 28px; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) {
  .card-in { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 420px) {
  .pad, .card { padding-inline-end: 14px; }
  .count b { font-size: 38px; }
}
</style>

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (act === "start") startSession();
    else if (act === "flip") { if (session && !session.revealed) { session.revealed = true; render(); } }
    else if (act === "grade") grade(+v);
    else if (act === "quit") { ui.view = "home"; session = null; render(); }
    else if (act === "home") { ui.view = "home"; session = null; render(); }
    else if (act === "mode") { state.settings.mode = v; persist(); render(); }
    else if (act === "perday") {
      state.settings.perDay = Math.max(5, Math.min(25, state.settings.perDay + (+v))); persist(); render();
    } else if (act === "cat") {
      var cs = state.settings.cats, i = cs.indexOf(v);
      if (i >= 0) { if (cs.length > 1) cs.splice(i, 1); } else cs.push(v);
      persist(); render();
    } else if (act === "reset") { ui.confirmReset = true; render(); }
    else if (act === "reset-no") { ui.confirmReset = false; render(); }
    else if (act === "reset-yes") {
      var keepSettings = state.settings;
      state = fresh(); state.settings = keepSettings;
      ui.confirmReset = false; persist(); render();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (ui.view !== "session" || !session || e.metaKey || e.ctrlKey || e.altKey) return;
    var onButton = e.target && e.target.tagName === "BUTTON";
    if (!session.revealed && (e.key === " " || e.key === "Enter")) {
      if (onButton) return;
      e.preventDefault(); session.revealed = true; render();
    } else if (session.revealed && "123".indexOf(e.key) >= 0 && e.key.length === 1) {
      e.preventDefault(); grade(+e.key - 1);
    }
  });

  render();

  /* ---------- Konto-Speicher (db), falls verfügbar ---------- */
  (async function () {
    try {
      if (!window.claude || !window.claude.use) return;
      var db = await window.claude.use("db");
      var user = await window.claude.use("user");
      if (!db || !user) return;
      var id = await user.id();
      if (!id) return;
      ref = db.doc("data/users/" + id + "/progress");
      var snap = await ref.get();
      if (snap.exists) {
        var remote = normalize(JSON.parse(JSON.stringify(snap.data())));
        if (remote.updated > state.updated) {
          state = remote;
          try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
        } else if (remote.updated < state.updated) {
          flush();
        }
      } else if (state.updated > 0) {
        flush();
      }
      ui.sync = "cloud";
      if (ui.view === "home") render();
    } catch (e) {
      ref = null; ui.sync = "local";
      if (ui.view === "home") render();
    }
  })();
})();
</script>
